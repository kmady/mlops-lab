[project]
name = "mlops-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.106",
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "mlflow>=3.17.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
mlops-lab = "mlops_lab:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
